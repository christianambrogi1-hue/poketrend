name: Aggiornamento prezzi

on:
  schedule:
    # 05:10 UTC = 07:10 in Italia d'estate, 06:10 d'inverno.
    # TCGdex aggiorna i prezzi Cardmarket intorno alle 15:00 UTC del giorno
    # prima, quindi a quest'ora il dato del giorno precedente e' gia' stabile.
    - cron: '10 5 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Primo giro completo su tutte le carte (lungo, ~1-2 ore)'
        type: boolean
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verifica la logica prima di toccare i dati
        run: node --test test/*.test.mjs

      - name: Scarica i prezzi
        run: |
          if [ "${{ inputs.bootstrap }}" = "true" ]; then
            node scripts/ingest.mjs --bootstrap
          else
            node scripts/ingest.mjs
          fi

      - name: Costruisci il pacchetto per la dashboard
        run: node scripts/build-web-data.mjs

      - name: Salva
        run: |
          git config user.name 'poketrend-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data
          if git diff --staged --quiet; then
            echo 'nessuna variazione'
          else
            git commit -m "prezzi $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Prepara il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: ingest
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
