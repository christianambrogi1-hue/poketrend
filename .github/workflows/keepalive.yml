name: Tieni sveglio lo scheduler

# GitHub disattiva i workflow schedulati dopo 60 giorni senza attivita' umana
# nel repository: i commit del bot non contano. Questo job scrive un file di
# battito una volta al mese per evitare che la dashboard smetta di aggiornarsi
# in silenzio. Se preferisci, cancellalo e ricordati di fare un push ogni tanto.
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%d > .keepalive
          git config user.name 'poketrend-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add .keepalive
          git diff --staged --quiet || (git commit -m 'keepalive' && git push)
